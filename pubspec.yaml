name: zet_affiliate_tracking
description: >-
  Affiliate click and conversion tracking for Flutter apps: deep links, the
  Google Play install referrer, referral codes, and an offline retry queue.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.affiliateplatform.affiliate_tracking
        pluginClass: AffiliateTrackingPlugin
      ios:
        pluginClass: AffiliateTrackingPlugin
